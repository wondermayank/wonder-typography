<style>
:root {
  --bg: #eef2f9;
  --surface: #f7f9fd;
  --card: #ffffff;
  --text: #151c2c;
  --muted: #5c6880;
  --accent: #635bff;
  --accent2: #ff3b8d;
  --border: rgba(99,91,255,0.14);
  --clay-light: 10px 10px 24px rgba(154,170,204,0.38), -8px -8px 20px rgba(255,255,255,0.92), inset 2px 2px 4px rgba(255,255,255,0.85);
  --clay-sm: 5px 5px 12px rgba(154,170,204,0.32), -4px -4px 10px rgba(255,255,255,0.9);
  --clay-inset: inset 3px 3px 8px rgba(154,170,204,0.34), inset -3px -3px 8px rgba(255,255,255,0.9);
}
[data-theme="dark"] {
  --bg: #0f1320;
  --surface: #171d2f;
  --card: #1d253b;
  --text: #f1f5ff;
  --muted: #9aa7c2;
  --accent: #818cf8;
  --accent2: #f472b6;
  --border: rgba(148,163,210,0.16);
  --clay-light: 10px 10px 24px rgba(4,6,14,0.65), -6px -6px 18px rgba(42,54,84,0.35), inset 1px 1px 2px rgba(255,255,255,0.08);
  --clay-sm: 5px 5px 12px rgba(4,6,14,0.55), -3px -3px 10px rgba(42,54,84,0.32);
  --clay-inset: inset 3px 3px 8px rgba(4,6,14,0.65), inset -2px -2px 6px rgba(45,58,90,0.35);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Montserrat', system-ui, -apple-system, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  transition: background .25s, color .25s;
}
.topbar {
  position: sticky; top: 0; z-index: 40;
  background: color-mix(in srgb, var(--surface) 90%, transparent);
  backdrop-filter: blur(16px);
  border-bottom: 1px solid var(--border);
  padding: 12px 20px;
}
.topbar-inner {
  max-width: 1520px; margin: 0 auto;
  display: flex; flex-wrap: wrap; align-items: center; gap: 12px; justify-content: space-between;
}
.brand {
  display: flex; align-items: center; gap: 10px; font-weight: 900; font-size: 1.1rem; letter-spacing: -.02em;
}
.brand-badge {
  width: 38px; height: 38px; border-radius: 13px;
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  color: #fff; display: grid; place-items: center; font-size: .95rem; font-weight: 900;
  box-shadow: var(--clay-sm);
}
.brand small { display: block; font-size: .66rem; font-weight: 700; color: var(--muted); letter-spacing: .04em; text-transform: uppercase; }

.global-input-wrap {
  flex: 1.3; min-width: 240px; max-width: 520px; position: relative; display: flex; align-items: center;
}
.global-input-wrap input {
  width: 100%; padding: 12px 76px 12px 16px; border-radius: 16px; border: 2px solid color-mix(in srgb, var(--accent) 30%, transparent);
  background: var(--bg); color: var(--text); font: 800 .95rem/1.2 'Montserrat', sans-serif;
  box-shadow: var(--clay-inset); outline: none; transition: border-color .2s;
}
.global-input-wrap input:focus { border-color: var(--accent); }
.clear-btn {
  position: absolute; right: 8px; padding: 6px 11px; border-radius: 11px; border: none;
  background: var(--card); color: var(--muted); font: 700 .72rem 'Montserrat', sans-serif;
  cursor: pointer; box-shadow: var(--clay-sm); display: none;
}
.clear-btn.show { display: inline-block; }

/* Global Stroke Bar in Topbar */
.stroke-bar {
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  background: var(--card); padding: 6px 11px; border-radius: 15px;
  border: 1px solid var(--border); box-shadow: var(--clay-sm);
}
.stroke-toggle-label {
  display: inline-flex; align-items: center; gap: 6px; font-size: .74rem; font-weight: 800;
  cursor: pointer; user-select: none; color: var(--text);
}
.stroke-toggle-label input { accent-color: var(--accent); width: 15px; height: 15px; cursor: pointer; }
.stroke-controls {
  display: flex; align-items: center; gap: 7px; transition: opacity .2s;
}
.stroke-controls.disabled { opacity: .42; pointer-events: none; }
.stroke-controls input[type="color"] {
  width: 28px; height: 26px; border: none; border-radius: 8px; cursor: pointer; background: none; padding: 0;
}
.stroke-controls input[type="range"] { width: 78px; accent-color: var(--accent); cursor: pointer; }
.stroke-val { font-size: .7rem; font-weight: 800; color: var(--accent); min-width: 30px; }

.controls-right { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.icon-btn {
  border: 1px solid var(--border); background: var(--card); color: var(--text);
  padding: 9px 13px; border-radius: 13px; font: 700 .78rem 'Montserrat', sans-serif;
  cursor: pointer; box-shadow: var(--clay-sm); transition: transform .15s;
}
.icon-btn:hover { transform: translateY(-1px); }

.filter-bar {
  max-width: 1520px; margin: 14px auto 8px; padding: 0 20px;
  display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between;
}
.pills { display: flex; flex-wrap: wrap; gap: 7px; align-items: center; }
.pill {
  border: 1px solid var(--border); background: var(--card); color: var(--muted);
  padding: 7px 13px; border-radius: 999px; font: 700 .75rem 'Montserrat', sans-serif;
  cursor: pointer; box-shadow: var(--clay-sm); transition: .18s;
}
.pill:hover { color: var(--text); transform: translateY(-1px); }
.pill.active {
  background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #fff; border-color: transparent;
}
.search-mini {
  padding: 8px 13px; border-radius: 999px; border: 1px solid var(--border);
  background: var(--surface); color: var(--text); font: 700 .78rem 'Montserrat', sans-serif;
  box-shadow: var(--clay-inset); outline: none; width: 205px;
}
.status-row {
  max-width: 1520px; margin: 4px auto 12px; padding: 0 20px;
  display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px;
  font-size: .78rem; font-weight: 700; color: var(--muted);
}

/* 5-column desktop grid */
.grid {
  max-width: 1520px; margin: 0 auto 48px; padding: 0 20px;
  display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 14px;
}
@media (max-width: 1220px) { .grid { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
@media (max-width: 920px)  { .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@media (max-width: 620px)  { .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; } }

.card {
  background: var(--card); border-radius: 18px; overflow: hidden;
  border: 1px solid var(--border); box-shadow: var(--clay-light);
  cursor: pointer; transition: transform .2s ease, box-shadow .2s ease;
  display: flex; flex-direction: column; position: relative;
}
.card:hover { transform: translateY(-4px) scale(1.01); }
.thumb-wrap {
  position: relative; width: 100%; aspect-ratio: 204 / 114; overflow: hidden;
  background: #141824;
}
.live-thumb {
  width: 100%; height: 100%; display: block; object-fit: cover;
}
.card-num {
  position: absolute; top: 7px; left: 7px; z-index: 3;
  background: rgba(12,16,28,0.72); color: #fff; backdrop-filter: blur(6px);
  padding: 2px 7px; border-radius: 999px; font-size: .64rem; font-weight: 800;
}
.live-badge {
  position: absolute; bottom: 7px; left: 7px; z-index: 3;
  background: linear-gradient(135deg, #ef4444, #f97316); color: #fff;
  padding: 2px 7px; border-radius: 999px; font-size: .58rem; font-weight: 900;
  letter-spacing: .04em; box-shadow: 0 2px 8px rgba(239,68,68,0.45);
}
.quick-dl {
  position: absolute; top: 7px; right: 7px; z-index: 4;
  border: none; background: rgba(99,91,255,0.92); color: #fff;
  width: 28px; height: 28px; border-radius: 9px; display: grid; place-items: center;
  cursor: pointer; opacity: 0; transform: scale(.9); transition: .18s; font-size: .82rem;
  box-shadow: 0 4px 10px rgba(0,0,0,0.35);
}
.card:hover .quick-dl { opacity: 1; transform: scale(1); }
.quick-dl:hover { background: var(--accent2); }
.card-foot {
  padding: 8px 11px; display: flex; align-items: center; justify-content: space-between; gap: 6px;
}
.card-name {
  font-size: .74rem; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.card-cat {
  font-size: .62rem; font-weight: 700; color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, transparent);
  padding: 2px 7px; border-radius: 999px; flex-shrink: 0;
}

/* Editor Modal */
.modal-backdrop {
  position: fixed; inset: 0; z-index: 100;
  background: rgba(8, 11, 20, 0.72); backdrop-filter: blur(10px);
  display: none; align-items: center; justify-content: center; padding: 16px;
}
.modal-backdrop.open { display: flex; }
.modal {
  width: 100%; max-width: 1080px; max-height: 94vh; overflow-y: auto;
  background: var(--surface); border-radius: 26px; border: 1px solid var(--border);
  box-shadow: 0 28px 70px rgba(0,0,0,0.5); padding: 20px; display: flex; flex-direction: column; gap: 16px;
}
.modal-head {
  display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
}
.modal-title-wrap { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.modal-id {
  background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #fff;
  padding: 4px 11px; border-radius: 999px; font-weight: 900; font-size: .78rem;
}
.modal-title { font-size: 1.15rem; font-weight: 900; }
.modal-nav { display: flex; gap: 7px; align-items: center; }

.editor-body {
  display: grid; grid-template-columns: 1.45fr 1fr; gap: 18px; align-items: start;
}
@media (max-width: 860px) { .editor-body { grid-template-columns: 1fr; } }

.stage-wrap {
  position: relative; border-radius: 20px; overflow: hidden;
  border: 1px solid var(--border); box-shadow: var(--clay-light);
  background: repeating-conic-gradient(#d8dee9 0% 25%, #f3f6fb 0% 50%) 50% / 20px 20px;
}
#editorCanvas { width: 100%; height: auto; display: block; aspect-ratio: 1200 / 660; }
.stage-hint {
  margin-top: 10px; background: var(--card); padding: 10px 14px; border-radius: 14px;
  box-shadow: var(--clay-sm); font-size: .74rem; color: var(--muted); font-weight: 600;
  display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px;
}
.stage-hint strong { color: var(--text); }

.panel {
  background: var(--card); border-radius: 20px; padding: 16px; box-shadow: var(--clay-light);
  display: flex; flex-direction: column; gap: 12px;
}
.field label {
  display: flex; justify-content: space-between; align-items: center;
  font-size: .72rem; font-weight: 800; color: var(--muted); margin-bottom: 6px; text-transform: uppercase; letter-spacing: .04em;
}
.field textarea {
  width: 100%; min-height: 76px; resize: vertical; padding: 11px 13px; border-radius: 14px;
  border: 1px solid var(--border); background: var(--bg); color: var(--text);
  font: 700 .98rem/1.35 'Montserrat', sans-serif; box-shadow: var(--clay-inset); outline: none;
}
.field textarea:focus { border-color: var(--accent); }
.field input[type="range"] { width: 100%; accent-color: var(--accent); cursor: pointer; }

/* Stroke card inside modal */
.stroke-box {
  background: var(--bg); border-radius: 15px; padding: 11px 12px;
  border: 1px solid var(--border); box-shadow: var(--clay-inset);
  display: flex; flex-direction: column; gap: 9px;
}
.stroke-box-top {
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
}
.stroke-box-body { display: flex; flex-direction: column; gap: 9px; transition: opacity .2s; }
.stroke-box-body.disabled { opacity: .45; pointer-events: none; }
.swatch-row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.swatch {
  width: 24px; height: 24px; border-radius: 8px; border: 2px solid var(--card);
  box-shadow: 0 2px 6px rgba(0,0,0,0.22); cursor: pointer; transition: transform .15s;
}
.swatch:hover { transform: scale(1.12); }
.swatch-picker {
  width: 32px; height: 26px; border: none; border-radius: 8px; cursor: pointer; background: none; padding: 0;
}

.bg-modes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.bg-modes button {
  border: 1px solid var(--border); background: var(--bg); color: var(--muted);
  padding: 8px 6px; border-radius: 11px; font: 700 .72rem 'Montserrat', sans-serif; cursor: pointer;
}
.bg-modes button.active { background: var(--accent); color: #fff; border-color: transparent; }
.color-row { display: none; align-items: center; gap: 10px; margin-top: 8px; }
.color-row.show { display: flex; }
.color-row input[type="color"] { width: 42px; height: 34px; border: none; border-radius: 8px; cursor: pointer; background: none; }

.actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 4px; }
.btn-primary, .btn-secondary {
  border: none; padding: 12px 14px; border-radius: 14px; font: 800 .79rem 'Montserrat', sans-serif;
  cursor: pointer; transition: transform .15s, opacity .15s; text-align: center;
}
.btn-primary {
  background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #fff;
  box-shadow: 0 8px 20px rgba(99,91,255,.35); grid-column: span 2;
}
.btn-secondary {
  background: var(--bg); color: var(--text); border: 1px solid var(--border); box-shadow: var(--clay-sm);
}
.btn-primary:hover, .btn-secondary:hover { transform: translateY(-1px); }
.toast {
  position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(80px);
  background: #111827; color: #fff; padding: 10px 18px; border-radius: 999px;
  font-size: .8rem; font-weight: 700; z-index: 200; opacity: 0; transition: .25s; pointer-events: none;
  box-shadow: 0 10px 28px rgba(0,0,0,0.4);
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>

<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <div class="brand-badge">987</div>
      <div>Wonder Typography Studio<small>987 Merged Styles • 50 Anime Logo Emblems (#1–50) + 350 Studio Pro + 202 Anime 3D + Text Style + Organic</small></div>
    </div>

    <div class="global-input-wrap">
      <input id="globalText" type="text" value="thunder" placeholder="Type your text — updates all 584 previews live..." autocomplete="off">
      <button id="clearGlobal" class="clear-btn">Reset</button>
    </div>

    <div class="stroke-bar" title="Add a custom outline stroke to all 584 live previews">
      <label class="stroke-toggle-label">
        <input id="globalStrokeOn" type="checkbox"> Add Stroke

      <div class="stroke-controls disabled" id="globalStrokeControls">

        <input id="globalStrokeWidth" type="range" min="1" max="24" value="6" title="Stroke Size">
        <span class="stroke-val" id="globalStrokeVal">6px</span>
      </div>
    </div>

    <div class="controls-right">
      <button id="themeToggle" class="icon-btn" title="Toggle Dark/Light Theme">Dark</button>
    </div>
  </div>
</header>

<section class="filter-bar">
  <div class="pills" id="catPills"></div>
  <input id="searchStyle" class="search-mini" type="search" placeholder="Search style or #1-987...">
</section>

<div class="status-row">
  <span id="countLabel">Showing 584 of 584 live previews</span>
  <div class="pills" id="sheetPills"></div>
</div>

<main class="grid" id="grid"></main>

<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal" role="dialog" aria-modal="true">
    <div class="modal-head">
      <div class="modal-title-wrap">
        <span class="modal-id" id="mId">#1</span>
        <span class="modal-title" id="mTitle">Style Name</span>
      </div>
      <div class="modal-nav">
        <button class="icon-btn" id="mPrev">← Prev</button>
        <button class="icon-btn" id="mNext">Next →</button>
        <button class="icon-btn" id="mClose">✕ Close</button>
      </div>
    </div>

    <div class="editor-body">
      <div>
        <div class="stage-wrap">
          <canvas id="editorCanvas" width="1200" height="660"></canvas>
        </div>
        <div class="stage-hint">
          <span><strong>Live HD Preview</strong> — updates instantly as you edit text or stroke</span>
          <span id="mFontInfo">Font: Montserrat</span>
        </div>
      </div>

      <div class="panel">
        <div class="field">
          <label>Your Text <button id="mResetText" class="icon-btn" style="padding:3px 9px;font-size:.66rem;">Default Text</button></label>
          <textarea id="mText" placeholder="Enter your text (supports multiple lines)..."></textarea>
        </div>

        <div class="stroke-box">
          <div class="stroke-box-top">
            <label class="stroke-toggle-label" style="margin:0;text-transform:uppercase;letter-spacing:.04em;font-size:.72rem;">
              <input id="mStrokeOn" type="checkbox"> Add Custom Stroke

// Deterministic seeded RNG so procedural textures never flicker while typing
function makeRng(seed) {
  let s = (seed * 1664525 + 1013904223) >>> 0;
  return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; };
}

function shadeHex(hex, factor) {
  const c = hex.replace('#','');
  const num = parseInt(c.length === 3 ? c.split('').map(x=>x+x).join('') : c, 16);
  const r = Math.max(0, Math.min(255, Math.round(((num >> 16) & 255) * factor)));
  const g = Math.max(0, Math.min(255, Math.round(((num >> 8) & 255) * factor)));
  const b = Math.max(0, Math.min(255, Math.round((num & 255) * factor)));
  return `rgb(${r},${g},${b})`;
}

function drawCheckered(ctx, w, h, dark) {
  const sz = Math.max(12, Math.round(w / 32));
  const c1 = dark ? '#2a2d33' : '#ffffff';
  const c2 = dark ? '#1f2228' : '#e6e9ef';
  for (let y = 0; y < h; y += sz) {
    for (let x = 0; x < w; x += sz) {
      ctx.fillStyle = ((x / sz + y / sz) % 2 === 0) ? c1 : c2;
      ctx.fillRect(x, y, sz, sz);
    }
  }
}

function drawSunburst(ctx, w, h, c1, c2, rays=22) {
  ctx.fillStyle = c2; ctx.fillRect(0, 0, w, h);
  const cx = w / 2, cy = h / 2, rad = Math.hypot(w, h);
  ctx.fillStyle = c1;
  for (let i = 0; i < rays; i++) {
    const a1 = (i * 2 * Math.PI) / rays;
    const a2 = a1 + Math.PI / rays;
    ctx.beginPath(); ctx.moveTo(cx, cy);
    ctx.arc(cx, cy, rad, a1, a2); ctx.closePath(); ctx.fill();
  }
}

function drawCloudsBorder(ctx, w, h) {
  ctx.fillStyle = '#ffffff'; ctx.strokeStyle = '#111111'; ctx.lineWidth = Math.max(2, w * 0.004);
  const drawRow = (yBase, dir) => {
    for (let i = 0; i < 8; i++) {
      const cx = (i / 7) * w + (i % 2 ? 10 : -10);
      const r = h * (0.14 + (i % 3) * 0.04);
      ctx.beginPath(); ctx.arc(cx, yBase + dir * r * 0.45, r, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    }
  };
  drawRow(0, -1); drawRow(h, 1);
}

function drawBricks(ctx, w, h, base, mortar, litBlue=false) {
  ctx.fillStyle = mortar; ctx.fillRect(0, 0, w, h);
  const rows = 9, cols = 6, bh = h / rows, bw = w / cols, gap = Math.max(2, w * 0.003);
  for (let r = 0; r < rows; r++) {
    const off = (r % 2) * (bw / 2);
    for (let c = -1; c <= cols; c++) {
      ctx.fillStyle = base;
      ctx.fillRect(c * bw + off + gap, r * bh + gap, bw - gap * 2, bh - gap * 2);
    }
  }
  if (litBlue) {
    const g = ctx.createRadialGradient(w/2, h/2, w*0.08, w/2, h/2, w*0.6);
    g.addColorStop(0, 'rgba(30,136,229,0.52)'); g.addColorStop(1, 'rgba(3,10,24,0.85)');
    ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
  }
}

function drawSynthGrid(ctx, w, h, base, gridColor) {
  const g = ctx.createLinearGradient(0, 0, 0, h);
  g.addColorStop(0, '#04020c'); g.addColorStop(0.55, base); g.addColorStop(1, '#080316');
  ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
  const hy = h * 0.56;
  ctx.save(); ctx.strokeStyle = gridColor; ctx.lineWidth = Math.max(1, w * 0.0018); ctx.globalAlpha = 0.55;
  for (let i = 0; i <= 10; i++) {
    const t = Math.pow(i / 10, 1.7);
    const y = hy + t * (h - hy);
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke();
  }
  for (let i = -8; i <= 8; i++) {
    ctx.beginPath(); ctx.moveTo(w/2 + i * w * 0.04, hy); ctx.lineTo(w/2 + i * w * 0.22, h); ctx.stroke();
  }
  ctx.restore();
  const glow = ctx.createLinearGradient(0, hy - h*0.1, 0, hy + h*0.1);
  glow.addColorStop(0, 'rgba(0,0,0,0)'); glow.addColorStop(0.5, gridColor + '55'); glow.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = glow; ctx.fillRect(0, hy - h*0.1, w, h*0.2);
}

function drawSplatter(ctx, w, h, cx, cy, colors, rng, count=48) {
  for (let i = 0; i < count; i++) {
    const col = colors[Math.floor(rng() * colors.length)];
    const ang = rng() * Math.PI * 2;
    const dist = Math.pow(rng(), 0.7) * Math.min(w, h) * 0.58;
    const x = cx + Math.cos(ang) * dist * 1.45;
    const y = cy + Math.sin(ang) * dist * 0.78;
    const r = (0.008 + rng() * 0.045) * h;
    ctx.fillStyle = col;
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
    if (rng() > 0.72) {
      ctx.fillRect(x - r*0.22, y, r*0.44, h * (0.08 + rng() * 0.25));
    }
  }
}

function drawStar4(ctx, x, y, r, color) {
  ctx.save(); ctx.translate(x, y); ctx.fillStyle = color;
  ctx.beginPath();
  for (let i = 0; i < 8; i++) {
    const a = (i * Math.PI) / 4;
    const rad = i % 2 === 0 ? r : r * 0.24;
    const px = Math.cos(a) * rad, py = Math.sin(a) * rad;
    i === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
  }
  ctx.closePath(); ctx.fill(); ctx.restore();
}

function drawBackground(ctx, w, h, bg, seed, bgMode, customColor) {
  if (bgMode === 'transparent') return;
  if (bgMode === 'custom') { ctx.fillStyle = customColor; ctx.fillRect(0, 0, w, h); return; }
  const rng = makeRng(seed * 73 + 11);
  const t = bg.t;

  if (t === 'solid') {
    ctx.fillStyle = bg.c; ctx.fillRect(0, 0, w, h);
  } else if (t === 'linear') {
    const g = ctx.createLinearGradient(0, 0, 0, h);
    bg.c.forEach((col, i) => g.addColorStop(i / Math.max(1, bg.c.length - 1), col));
    ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
  } else if (t === 'radial') {
    const g = ctx.createRadialGradient(w/2, h/2, w*0.05, w/2, h/2, w*0.62);
    bg.c.forEach((col, i) => g.addColorStop(i / Math.max(1, bg.c.length - 1), col));
    ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
  } else if (t === 'check_light') {
    drawCheckered(ctx, w, h, false);
  } else if (t === 'check_dark') {
    drawCheckered(ctx, w, h, true);
  } else if (t === 'brick_dark') {
    drawBricks(ctx, w, h, bg.b || '#151722', bg.c || '#090a10', false);
  } else if (t === 'brick_white') {
    drawBricks(ctx, w, h, '#f2f3f5', '#d5d8de', false);
    drawSplatter(ctx, w, h, w*0.5, h*0.55, ['#ff2e93','#00d4ff','#a3e635','#ffe600'], rng, 36);
  } else if (t === 'brick_blue') {
    drawBricks(ctx, w, h, '#1d3354', '#0b1526', true);
  } else if (t === 'sunburst') {
    drawSunburst(ctx, w, h, bg.c1, bg.c2, 24);
    if (bg.stars) {
      for (let i = 0; i < 18; i++) drawStar4(ctx, rng()*w, rng()*h, h*(0.015+rng()*0.025), '#ffffff');
    }
  } else if (t === 'sunburst_clouds') {
    drawSunburst(ctx, w, h, bg.c1, bg.c2, 22);
    drawCloudsBorder(ctx, w, h);
  } else if (t === 'comic_burst') {
    if (bg.rays) { drawSunburst(ctx, w, h, bg.c, bg.dot, 20); }
    else {
      ctx.fillStyle = bg.c; ctx.fillRect(0, 0, w, h);
      ctx.fillStyle = bg.dot;
      const step = Math.max(10, w * 0.018);
      for (let y = 0; y < h; y += step) for (let x = 0; x < w; x += step) {
        ctx.beginPath(); ctx.arc(x + ((y/step)%2)*step*0.5, y, step*0.24, 0, Math.PI*2); ctx.fill();
      }
    }
    ctx.save(); ctx.translate(w/2, h/2); ctx.fillStyle = bg.burst; ctx.strokeStyle = '#111111'; ctx.lineWidth = Math.max(3, w*0.006);
    ctx.beginPath();
    const pts = 24;
    for (let i = 0; i < pts; i++) {
      const a = (i / pts) * Math.PI * 2;
      const rx = i % 2 === 0 ? w * 0.44 : w * 0.32;
      const ry = i % 2 === 0 ? h * 0.49 : h * 0.34;
      const px = Math.cos(a) * rx, py = Math.sin(a) * ry;
      i === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
    }
    ctx.closePath(); ctx.fill(); ctx.stroke(); ctx.restore();
  } else if (t === 'tech_blue') {
    const g = ctx.createRadialGradient(w*0.5, h*0.5, w*0.05, w*0.5, h*0.5, w*0.65);
    g.addColorStop(0, bg.c2); g.addColorStop(1, bg.c);
    ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
    ctx.strokeStyle = 'rgba(100,180,255,0.22)'; ctx.lineWidth = Math.max(1.5, w*0.002);
    for (let i = 0; i < 16; i++) {
      const y = rng() * h;
      ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y - h*0.18); ctx.stroke();
    }
  } else if (t === 'splatter') {
    ctx.fillStyle = bg.c; ctx.fillRect(0, 0, w, h);
    drawSplatter(ctx, w, h, w/2, h/2, [bg.sp], rng, 65);
  } else if (t === 'splatter_multi') {
    ctx.fillStyle = bg.c; ctx.fillRect(0, 0, w, h);
    drawSplatter(ctx, w, h, w/2, h/2, ['#9333ea','#38bdf8','#ec4899','#111827','#06b6d4'], rng, 72);
  } else if (t === 'splatter_cyan') {
    ctx.fillStyle = '#d4f3fc'; ctx.fillRect(0, 0, w, h);
    drawSplatter(ctx, w, h, w/2, h*0.48, ['#00b4d8','#38bdf8','#0284c7'], rng, 65);
  } else if (t === 'fire_bg') {
    ctx.fillStyle = '#080100'; ctx.fillRect(0, 0, w, h);
    for (let i = 0; i < 45; i++) {
      const x = rng()*w, y = rng()*h, r = h*(0.06+rng()*0.18);
      const g = ctx.createRadialGradient(x, y, 0, x, y, r);
      g.addColorStop(0, 'rgba(255,90,0,0.28)'); g.addColorStop(1, 'rgba(120,0,0,0)');
      ctx.fillStyle = g; ctx.fillRect(x-r, y-r, r*2, r*2);
    }
    for (let i = 0; i < 60; i++) {
      ctx.fillStyle = rng()>0.5 ? '#ffaa00' : '#ff3300';
      ctx.beginPath(); ctx.arc(rng()*w, rng()*h, Math.max(1.2, h*0.005*rng()), 0, Math.PI*2); ctx.fill();
    }
  } else if (t === 'synth_grid') {
    drawSynthGrid(ctx, w, h, bg.c, bg.grid);
  } else if (t === 'retrowave_sun') {
    const g = ctx.createLinearGradient(0, 0, 0, h);
    g.addColorStop(0, '#13052b'); g.addColorStop(0.55, '#59165e'); g.addColorStop(1, '#120424');
    ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);

    const sg = ctx.createLinearGradient(sx, sy-sr, sx, sy+sr);

    ctx.fillStyle = '#2d0b3a';
    ctx.beginPath(); ctx.moveTo(0, h*0.64);

  } else if (t === 'fireworks_balloons' || t === 'fireworks_gold') {

        ctx.beginPath(); ctx.moveTo(fx, fy); ctx.lineTo(fx+Math.cos(a)*len, fy+Math.sin(a)*len); ctx.stroke();

  } else if (t === 'halftone_gold') {

  } else if (t === 'wood_holiday') {

  } else if (t === 'snowflakes_white') {

function makeChromeGrad(ctx, y0, y1, preset) {
  const g = ctx.createLinearGradient(0, y0, 0, y1);
  const map = {
    gold:        [[0,'#fff8c4'],[0.24,'#f5c542'],[0.48,'#9e6808'],[0.52,'#fff2a6'],[0.78,'#d49b24'],[1,'#6e4704']],
    gold_serif:  [[0,'#fffbe0'],[0.3,'#e6b84c'],[0.52,'#8c5e10'],[0.72,'#ffe484'],[1,'#6b4506']],
    gold_dark:   [[0,'#ffe8b0'],[0.35,'#9c6b30'],[0.5,'#2e1c0a'],[0.65,'#ffd180'],[1,'#5e3810']],
    rose_gold:   [[0,'#fff5e4'],[0.3,'#f0c080'],[0.55,'#b87c3c'],[0.8,'#ffe0a8'],[1,'#7a4c1e']],
    silver:      [[0,'#ffffff'],[0.28,'#cfd6e0'],[0.49,'#58606e'],[0.53,'#eef2f7'],[0.8,'#9aa3b2'],[1,'#474d59']],
    silver_serif:[[0,'#ffffff'],[0.35,'#d4dae3'],[0.55,'#6b7280'],[0.8,'#e5e7eb'],[1,'#4b5563']],
    titanium:    [[0,'#f3f4f6'],[0.45,'#9ca3af'],[0.75,'#6b7280'],[1,'#374151']],
    bronze:      [[0,'#ffe0b8'],[0.28,'#d48a4c'],[0.5,'#6e3a16'],[0.72,'#e6a268'],[1,'#4d250a']],
    arcade:      [[0,'#b8f8ff'],[0.4,'#ffffff'],[0.52,'#5e178a'],[0.75,'#e040fb'],[1,'#ff80e0']],
    synth:       [[0,'#99f6ff'],[0.35,'#ffffff'],[0.52,'#3b0764'],[0.75,'#d946ef'],[1,'#60a5fa']],
    retrowave:   [[0,'#4de6ff'],[0.38,'#d9ffff'],[0.5,'#3d0854'],[0.72,'#ff3399'],[1,'#ffaa44']],
    liquid_pink: [[0,'#ffffff'],[0.22,'#ff85c0'],[0.45,'#60a5fa'],[0.68,'#ffffff'],[0.85,'#e879f9'],[1,'#9333ea']],
    y2k:         [[0,'#ffffff'],[0.25,'#67e8f9'],[0.48,'#1e1b4b'],[0.65,'#f472b6'],[0.85,'#c4b5fd'],[1,'#ffffff']],
    jackpot:     [[0,'#ffffff'],[0.3,'#e879f9'],[0.52,'#581c87'],[0.75,'#c026d3'],[1,'#ff77cc']],
    cyber:       [[0,'#38bdf8'],[0.38,'#e0f2fe'],[0.52,'#4c1d95'],[0.76,'#ec4899'],[1,'#a855f7']],
  };
  (map[preset] || map.gold).forEach(([s, c]) => g.addColorStop(s, c));
  return g;
}

function makeTextureCanvas(tex, w, h, seed, extra) {
  const oc = document.createElement('canvas');
  oc.width = Math.max(256, Math.round(w)); oc.height = Math.max(140, Math.round(h));
  const c = oc.getContext('2d');
  const rng = makeRng(seed * 97 + 3);
  const ow = oc.width, oh = oc.height;

  if (tex === 'fire' || tex === 'bluefire') {
    const g = c.createLinearGradient(0, 0, 0, oh);
    if (tex === 'bluefire') {
      g.addColorStop(0, '#0066ff'); g.addColorStop(0.35, '#00e5ff'); g.addColorStop(0.75, '#ccf8ff'); g.addColorStop(1, '#0088ff');
    } else {
      g.addColorStop(0, '#ff1a00'); g.addColorStop(0.38, '#ff7b00'); g.addColorStop(0.75, '#fff04d'); g.addColorStop(1, '#ff4500');
    }
    c.fillStyle = g; c.fillRect(0, 0, ow, oh);
    for (let i = 0; i < 120; i++) {
      const x = rng()*ow, y = rng()*oh, r = oh*(0.03+rng()*0.09);
      const rg = c.createRadialGradient(x, y, 0, x, y, r);
      rg.addColorStop(0, tex==='bluefire' ? 'rgba(255,255,255,0.65)' : 'rgba(255,255,150,0.7)');
      rg.addColorStop(1, 'rgba(255,0,0,0)');
      c.fillStyle = rg; c.fillRect(x-r, y-r, r*2, r*2);
    }
  } else if (tex === 'glitter' || tex === 'glitter_silver') {
    c.fillStyle = tex==='glitter' ? '#a67418' : '#7a8a9e'; c.fillRect(0, 0, ow, oh);
    const cols = tex==='glitter' ? ['#fff8c4','#ffd24d','#e6a822','#ffffff','#8c5c08'] : ['#ffffff','#dbeafe','#93c5fd','#64748b','#e2e8f0'];
    for (let i = 0; i < 1600; i++) {
      c.fillStyle = cols[Math.floor(rng()*cols.length)];
      c.fillRect(rng()*ow, rng()*oh, 2+rng()*3, 2+rng()*3);
    }
  } else if (tex === 'gem') {
    c.fillStyle = '#d4d8e0'; c.fillRect(0, 0, ow, oh);
    const step = Math.max(8, ow / 52);
    for (let y = 0; y < oh; y += step) for (let x = 0; x < ow; x += step) {
      const g = c.createRadialGradient(x+step*0.4, y+step*0.4, 1, x+step*0.5, y+step*0.5, step*0.5);
      g.addColorStop(0, '#ffffff'); g.addColorStop(0.55, '#e2e8f0'); g.addColorStop(1, '#71717a');
      c.fillStyle = g; c.beginPath(); c.arc(x+step/2, y+step/2, step*0.44, 0, Math.PI*2); c.fill();
    }
  } else if (tex === 'disco') {
    const step = Math.max(7, ow / 56);
    const cols = ['#fff6cc','#d4a84f','#5c4014','#1f1608','#ffffff','#b88a32'];
    for (let y = 0; y < oh; y += step) for (let x = 0; x < ow; x += step) {
      c.fillStyle = cols[Math.floor(rng()*cols.length)];
      c.fillRect(x+0.5, y+0.5, step-1, step-1);
    }
  } else if (tex === 'candy') {
    const g = c.createLinearGradient(0, 0, ow, 0);
    g.addColorStop(0, '#ff85b3'); g.addColorStop(0.33, '#ffd966'); g.addColorStop(0.66, '#7dd3fc'); g.addColorStop(1, '#d8b4fe');
    c.fillStyle = g; c.fillRect(0, 0, ow, oh);
    const spr = ['#ffffff','#ff2e63','#00d4ff','#ffe600','#22c55e'];
    for (let i = 0; i < 220; i++) {
      c.save(); c.translate(rng()*ow, rng()*oh); c.rotate(rng()*Math.PI);
      c.fillStyle = spr[Math.floor(rng()*spr.length)];
      c.fillRect(-5, -2, 10, 4); c.restore();
    }
  } else if (tex === 'cookie') {
    c.fillStyle = '#c98842'; c.fillRect(0, 0, ow, oh);
    for (let i = 0; i < 300; i++) {
      c.fillStyle = rng()>0.5 ? '#b3712e' : '#de9f59';
      c.beginPath(); c.arc(rng()*ow, rng()*oh, 2+rng()*5, 0, Math.PI*2); c.fill();
    }
    for (let i = 0; i < 160; i++) {
      c.fillStyle = '#42200a';
      c.beginPath(); c.arc(rng()*ow, rng()*oh, 3+rng()*5, 0, Math.PI*2); c.fill();
    }
  } else if (tex === 'corncob') {
    c.fillStyle = '#c47a0e'; c.fillRect(0, 0, ow, oh);
    const step = Math.max(8, ow / 54);
    for (let y = 0; y < oh; y += step) for (let x = 0; x < ow; x += step) {
      c.fillStyle = rng()>0.3 ? '#ffd23f' : '#f4a21c';
      c.beginPath(); c.arc(x+step/2, y+step/2, step*0.42, 0, Math.PI*2); c.fill();
    }
  } else if (tex === 'peppermint') {
    c.fillStyle = '#ffffff'; c.fillRect(0, 0, ow, oh);
    c.strokeStyle = '#dc2626'; c.lineWidth = Math.max(6, ow*0.015);
    for (let i = -oh; i < ow + oh; i += ow*0.045) {
      c.beginPath(); c.moveTo(i, 0); c.lineTo(i + oh, oh); c.stroke();
    }
    c.strokeStyle = '#16a34a'; c.lineWidth = Math.max(3, ow*0.008);
    for (let i = -oh + ow*0.022; i < ow + oh; i += ow*0.045) {
      c.beginPath(); c.moveTo(i, 0); c.lineTo(i + oh, oh); c.stroke();
    }
  } else if (tex === 'striped') {
    const step = Math.max(6, oh / 22);
    for (let y = 0; y < oh; y += step) {
      c.fillStyle = (Math.floor(y/step) % 2 === 0) ? '#ffe033' : '#f97316';
      c.fillRect(0, y, ow, step);
    }
  } else if (tex === 'halftone') {
    c.clearRect(0, 0, ow, oh);
    c.fillStyle = '#2b303a';
    const step = Math.max(5, ow / 80);
    for (let y = 0; y < oh; y += step) for (let x = 0; x < ow; x += step) {
      c.beginPath(); c.arc(x + ((y/step)%2)*step*0.5, y, step*0.36, 0, Math.PI*2); c.fill();
    }
  } else if (tex === 'floral') {
    const g = c.createLinearGradient(0, 0, ow, oh);
    g.addColorStop(0, '#ff1e88'); g.addColorStop(0.5, '#f59e0b'); g.addColorStop(1, '#7c3aed');
    c.fillStyle = g; c.fillRect(0, 0, ow, oh);
    const cols = ['#ffe600','#00e5ff','#ff477e','#ffffff','#a855f7'];
    for (let i = 0; i < 140; i++) {
      c.fillStyle = cols[Math.floor(rng()*cols.length)];
      c.beginPath(); c.arc(rng()*ow, rng()*oh, 4+rng()*12, 0, Math.PI*2); c.fill();
    }
  } else if (tex === 'watercolor') {
    const pal = (extra && extra.grad) || ['#ff2e93','#38bdf8','#c084fc'];
    const g = c.createLinearGradient(0, 0, ow, oh);
    pal.forEach((col, i) => g.addColorStop(i / Math.max(1, pal.length-1), col));
    c.fillStyle = g; c.fillRect(0, 0, ow, oh);
    for (let i = 0; i < 65; i++) {
      c.fillStyle = pal[Math.floor(rng()*pal.length)] + '55';
      c.beginPath(); c.arc(rng()*ow, rng()*oh, oh*(0.06+rng()*0.15), 0, Math.PI*2); c.fill();
    }
  } else if (tex === 'dogpaw') {
    c.fillStyle = '#854216'; c.fillRect(0, 0, ow, oh);
    c.fillStyle = '#5c2a0a';
    const step = Math.max(20, ow / 18);
    for (let y = 0; y < oh; y += step) for (let x = 0; x < ow; x += step) {
      c.beginPath(); c.arc(x+step*0.5, y+step*0.55, step*0.18, 0, Math.PI*2); c.fill();
      c.beginPath(); c.arc(x+step*0.35, y+step*0.35, step*0.08, 0, Math.PI*2); c.fill();
      c.beginPath(); c.arc(x+step*0.5, y+step*0.28, step*0.08, 0, Math.PI*2); c.fill();
      c.beginPath(); c.arc(x+step*0.65, y+step*0.35, step*0.08, 0, Math.PI*2); c.fill();
    }
  } else if (tex === 'cash') {
    c.fillStyle = '#4e7a52'; c.fillRect(0, 0, ow, oh);
    c.strokeStyle = '#c4d9be'; c.lineWidth = 1.5;
    for (let y = 0; y < oh; y += 5) { c.beginPath(); c.moveTo(0,y); c.lineTo(ow,y); c.stroke(); }
  } else if (tex === 'wood') {
    c.fillStyle = '#c27932'; c.fillRect(0, 0, ow, oh);
    c.strokeStyle = 'rgba(70,30,5,0.35)'; c.lineWidth = 3;
    for (let y = 0; y < oh; y += 10) { c.beginPath(); c.moveTo(0,y); c.bezierCurveTo(ow*0.3,y+4,ow*0.7,y-4,ow,y); c.stroke(); }
  } else if (tex === 'hammered') {
    const g = c.createLinearGradient(0, 0, 0, oh);
    g.addColorStop(0, '#fff2a6'); g.addColorStop(0.5, '#c98e1e'); g.addColorStop(1, '#5e3c04');
    c.fillStyle = g; c.fillRect(0, 0, ow, oh);
    for (let i = 0; i < 160; i++) {
      c.strokeStyle = rng()>0.5 ? 'rgba(255,255,220,0.45)' : 'rgba(50,30,0,0.45)';
      c.lineWidth = 2; c.beginPath();
      const x = rng()*ow, y = rng()*oh;
      c.moveTo(x,y); c.lineTo(x+(rng()-0.5)*36, y+(rng()-0.5)*28); c.stroke();
    }
  } else if (tex === 'ruby') {
    const g = c.createLinearGradient(0, 0, 0, oh);
    g.addColorStop(0, '#ff8080'); g.addColorStop(0.35, '#e60026'); g.addColorStop(0.65, '#800014'); g.addColorStop(1, '#ff334d');
    c.fillStyle = g; c.fillRect(0, 0, ow, oh);
    c.fillStyle = 'rgba(255,255,255,0.28)';
    for (let i = 0; i < 14; i++) {
      c.beginPath(); c.moveTo(i*ow/10, 0); c.lineTo(i*ow/10 + ow*0.06, 0); c.lineTo(i*ow/10 - ow*0.04, oh); c.fill();
    }
  } else if (tex === 'glass') {
    const g = c.createLinearGradient(0, 0, 0, oh);
    g.addColorStop(0, 'rgba(255,255,255,0.58)'); g.addColorStop(0.45, 'rgba(210,225,245,0.25)');
    g.addColorStop(0.55, 'rgba(120,145,175,0.22)'); g.addColorStop(1, 'rgba(255,255,255,0.42)');
    c.fillStyle = g; c.fillRect(0, 0, ow, oh);
  }
  return oc;
}

function setFont(ctx, style, px) {
  const w = style.weight || 700;
  const it = style.italic ? 'italic ' : '';
  ctx.font = `${it}${w} ${Math.round(px)}px "${style.font}", sans-serif`;
}

function measureTracked(ctx, text, track) {
  if (!track) return ctx.measureText(text).width;
  let total = 0;
  for (let i = 0; i < text.length; i++) {
    total += ctx.measureText(text[i]).width + (i < text.length - 1 ? track : 0);
  }
  return total;
}

function drawTracked(ctx, text, x, y, track, mode) {
  if (!track) { mode === 'stroke' ? ctx.strokeText(text, x, y) : ctx.fillText(text, x, y); return; }
  const total = measureTracked(ctx, text, track);
  let cx = x - total / 2;
  ctx.save(); ctx.textAlign = 'left';
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    mode === 'stroke' ? ctx.strokeText(ch, cx, y) : ctx.fillText(ch, cx, y);
    cx += ctx.measureText(ch).width + track;
  }
  ctx.restore();
}

function applyUserStrokeHelper(ctx, drawFn, opts, scale, baseOuterPx = 0) {
  if (!opts.strokeOn || !(opts.strokeWidth > 0)) return;
  const sw = opts.strokeWidth;
  const col = opts.strokeColor || '#000000';
  ctx.save();
  ctx.lineJoin = 'round';
  ctx.lineCap = 'round';
  if (opts.strokeDouble) {
    ctx.strokeStyle = col;
    ctx.lineWidth = (baseOuterPx + sw * 2.8) * scale;
    drawFn();
    ctx.strokeStyle = col.toLowerCase() === '#ffffff' ? '#111111' : '#ffffff';
    ctx.lineWidth = (baseOuterPx + sw * 1.45) * scale;
    drawFn();
  } else {
    ctx.strokeStyle = col;
    ctx.lineWidth = (baseOuterPx + sw * 2.1) * scale;
    drawFn();
  }
  ctx.restore();
}

function renderSpecialTransform(ctx, w, h, style, lines, fontSize, track, lineH, rng, opts, scale) {
  const fx = style.fx;
  const tr = fx.transform;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.lineJoin = 'round'; ctx.lineCap = 'round';

  if (tr === 'sphere') {
    const phrase = (lines.join(' ') || 'SPHERE TEXT EFFECT').toUpperCase() + '  ';
    const R = Math.min(w, h) * 0.42;
    const rows = 11;
    for (let r = 0; r < rows; r++) {
      const lat = ((r / (rows - 1)) - 0.5) * Math.PI * 0.86;
      const y = h / 2 + Math.sin(lat) * R;
      const ringR = Math.cos(lat) * R;
      const rowScaleY = Math.max(0.28, Math.cos(lat));
      const rowFont = Math.max(10, R * 0.145 * rowScaleY);
      setFont(ctx, style, rowFont);
      const cols = 28;
      for (let c = 0; c < cols; c++) {
        const lon = ((c / (cols - 1)) - 0.5) * Math.PI * 0.96;
        const x = w / 2 + Math.sin(lon) * ringR;
        const scaleX = Math.cos(lon);
        if (scaleX < 0.08) continue;
        const ch = phrase[(r * 7 + c) % phrase.length];
        ctx.save();
        ctx.translate(x, y);
        ctx.scale(scaleX, rowScaleY);
        if (opts.strokeOn && opts.strokeWidth > 0) {
          ctx.strokeStyle = opts.strokeColor;
          ctx.lineWidth = Math.max(1.5, opts.strokeWidth * 0.35 * scale);
          ctx.strokeText(ch, 0, 0);
        }
        ctx.fillStyle = `rgba(255,255,255,${0.25 + 0.75 * scaleX * rowScaleY})`;
        ctx.fillText(ch, 0, 0);
        ctx.restore();
      }
    }
    return true;
  }

  if (tr === 'cylinder') {
    const phrase = lines.join(' ') || 'Typographic Motion Effect';
    const rows = 9;
    for (let r = 0; r < rows; r++) {
      const t = (r / (rows - 1)) * 2 - 1;
      const y = h * (0.18 + (r / (rows - 1)) * 0.64);
      const scaleY = Math.max(0.35, Math.cos(t * 1.15));
      const fz = Math.min(h * 0.095, (w * 0.74) / Math.max(8, phrase.length * 0.55));
      setFont(ctx, style, fz);
      ctx.save();
      ctx.translate(w / 2 + Math.sin(t * 1.8) * w * 0.03, y);
      ctx.scale(1, scaleY);
      if (opts.strokeOn && opts.strokeWidth > 0) {
        ctx.strokeStyle = opts.strokeColor;
        ctx.lineWidth = Math.max(2, opts.strokeWidth * 0.65 * scale);
        ctx.strokeText(phrase, 0, 0);
      }
      ctx.fillStyle = `rgba(255,255,255,${0.4 + 0.6 * scaleY})`;
      ctx.fillText(phrase, 0, 0);
      ctx.restore();
    }
    return true;
  }

  if (tr === 'echo_down' || tr === 'echo_both') {
    const txt = lines.join(' ') || style.text;
    const fz = fontSize * 0.85;
    setFont(ctx, style, fz);
    const step = fz * 0.52;
    if (tr === 'echo_down') {
      const cnt = fx.count || 5;
      const startY = h * 0.28;
      for (let i = cnt; i >= 1; i--) {
        ctx.globalAlpha = Math.max(0.18, 1 - i * 0.14);
        ctx.fillStyle = fx.fill;
        drawTracked(ctx, txt, w/2, startY + i * step, track, 'fill');
      }
      ctx.globalAlpha = 1;
      applyUserStrokeHelper(ctx, () => drawTracked(ctx, txt, w/2, startY, track, 'stroke'), opts, scale, 0);
      ctx.fillStyle = fx.fill;
      drawTracked(ctx, txt, w/2, startY, track, 'fill');
    } else {
      const cnt = fx.count || 3;
      ctx.lineWidth = Math.max(1.5, fz * 0.03);
      ctx.strokeStyle = fx.stroke;
      for (let i = -cnt; i <= cnt; i++) {
        if (i === 0) continue;
        ctx.globalAlpha = Math.max(0.28, 1 - Math.abs(i) * 0.22);
        drawTracked(ctx, txt, w/2, h/2 + i * step, track, 'stroke');
      }
      ctx.globalAlpha = 1;
      applyUserStrokeHelper(ctx, () => drawTracked(ctx, txt, w/2, h/2, track, 'stroke'), opts, scale, 0);
      ctx.fillStyle = fx.fill;
      drawTracked(ctx, txt, w/2, h/2, track, 'fill');
    }
    return true;
  }

  if (tr === 'iso' || tr === 'iso_multi') {
    const txt = lines.join(' ') || style.text;
    const fz = fontSize * 1.05;
    setFont(ctx, style, fz);
    const depth = Math.round((fx.depth || 18) * scale);
    const palette = ['#ffe033','#38bdf8','#ff6b35','#ff4da6','#a3e635'];
    ctx.save();
    ctx.translate(w/2, h/2);
    ctx.transform(1, -0.34, 0.22, 0.92, 0, 0);
    const chars = [...txt];
    const widths = chars.map(c => ctx.measureText(c).width + track);
    const total = widths.reduce((a,b)=>a+b, 0);
    let cx = -total/2;
    const strokeCol = (opts.strokeOn && opts.strokeWidth > 0) ? opts.strokeColor : fx.stroke;
    const extraW = (opts.strokeOn && opts.strokeWidth > 0) ? opts.strokeWidth * 1.4 * scale : 0;
    chars.forEach((ch, idx) => {
      const cw = widths[idx];
      const lx = cx + cw/2;
      const topCol = tr === 'iso_multi' ? palette[idx % palette.length] : fx.fill;
      const sideCol = tr === 'iso_multi' ? palette[(idx + 2) % palette.length] : fx.side;
      for (let d = depth; d >= 1; d--) {
        ctx.fillStyle = sideCol; ctx.strokeStyle = strokeCol; ctx.lineWidth = Math.max(3, fz*0.055) + extraW;
        ctx.strokeText(ch, lx - d*0.5, d*0.95);
        ctx.fillText(ch, lx - d*0.5, d*0.95);
      }
      ctx.lineWidth = Math.max(3, fz*0.055) + extraW; ctx.strokeStyle = strokeCol;
      ctx.strokeText(ch, lx, 0);
      ctx.fillStyle = topCol; ctx.fillText(ch, lx, 0);
      cx += cw;
    });
    ctx.restore();
    return true;
  }

  if (tr === 'cubes') {
    const txtLines = lines.map(l => l.toUpperCase());
    const maxLen = Math.max(...txtLines.map(l => l.length), 1);
    const sz = Math.min(w / (maxLen * 1.65), h / (txtLines.length * 1.65));
    const totalH = txtLines.length * sz * 1.25;
    const edgeCol = (opts.strokeOn && opts.strokeWidth > 0) ? opts.strokeColor : '#312e81';
    const edgeW = (opts.strokeOn && opts.strokeWidth > 0) ? Math.max(2, opts.strokeWidth * 0.5 * scale) : Math.max(1.5, sz*0.03);
    txtLines.forEach((line, li) => {
      const rowW = line.length * sz * 1.15;
      const startX = w/2 - rowW/2 + sz*0.55;
      const cy = h/2 - totalH/2 + li * sz * 1.25 + sz*0.65;
      for (let ci = 0; ci < line.length; ci++) {
        const ch = line[ci];
        if (ch === ' ') continue;
        const cx = startX + ci * sz * 1.15;
        const s = sz * 0.56;
        ctx.fillStyle = '#ffffff'; ctx.strokeStyle = edgeCol; ctx.lineWidth = edgeW;
        ctx.beginPath(); ctx.moveTo(cx, cy - s); ctx.lineTo(cx + s*0.86, cy - s*0.5); ctx.lineTo(cx, cy); ctx.lineTo(cx - s*0.86, cy - s*0.5); ctx.closePath(); ctx.fill(); ctx.stroke();
        ctx.fillStyle = '#f1f5f9';
        ctx.beginPath(); ctx.moveTo(cx - s*0.86, cy - s*0.5); ctx.lineTo(cx, cy); ctx.lineTo(cx, cy + s); ctx.lineTo(cx - s*0.86, cy + s*0.5); ctx.closePath(); ctx.fill(); ctx.stroke();
        ctx.fillStyle = '#e2e8f0';
        ctx.beginPath(); ctx.moveTo(cx + s*0.86, cy - s*0.5); ctx.lineTo(cx, cy); ctx.lineTo(cx, cy + s); ctx.lineTo(cx + s*0.86, cy + s*0.5); ctx.closePath(); ctx.fill(); ctx.stroke();
        setFont(ctx, style, s * 0.72);
        ctx.fillStyle = '#f59e0b'; ctx.fillText(ch, cx, cy - s*0.48);
        ctx.fillStyle = '#ec4899'; ctx.fillText(ch, cx - s*0.42, cy + s*0.26);
        ctx.fillStyle = '#0ea5e9'; ctx.fillText(ch, cx + s*0.42, cy + s*0.26);
      }
    });
    return true;
  }

  if (tr === 'scrabble') {
    const txtLines = lines.map(l => l.toUpperCase());
    const maxLen = Math.max(...txtLines.map(l => l.length), 4);
    const tile = Math.min(w * 0.84 / maxLen, h * 0.72 / Math.max(1, txtLines.length));
    const gap = tile * 0.1;
    const totalH = txtLines.length * (tile + gap);
    txtLines.forEach((line, li) => {
      const rowW = line.length * (tile + gap) - gap;
      let x = w/2 - rowW/2;
      const y = h/2 - totalH/2 + li * (tile + gap);
      for (let i = 0; i < line.length; i++) {
        const ch = line[i];
        if (ch !== ' ') {
          ctx.save();
          ctx.translate(x + tile/2, y + tile/2);
          ctx.rotate((rng() - 0.5) * 0.14);
          ctx.shadowColor = 'rgba(0,0,0,0.55)'; ctx.shadowBlur = 10; ctx.shadowOffsetY = 5;
          ctx.fillStyle = '#f3e3c3';
          ctx.beginPath(); ctx.roundRect(-tile/2, -tile/2, tile, tile, tile*0.14); ctx.fill();
          ctx.shadowColor = 'transparent';
          ctx.strokeStyle = (opts.strokeOn && opts.strokeWidth > 0) ? opts.strokeColor : '#c4a474';
          ctx.lineWidth = (opts.strokeOn && opts.strokeWidth > 0) ? Math.max(2, opts.strokeWidth * 0.55 * scale) : Math.max(1.5, tile*0.04);
          ctx.stroke();
          setFont(ctx, style, tile * 0.62);
          ctx.fillStyle = '#291a10'; ctx.fillText(ch, 0, tile*0.03);
          ctx.restore();
        }
        x += tile + gap;
      }
    });
    return true;
  }

  if (tr === 'button') {
    const txt = lines.join(' ') || 'Button Maker';
    const bw = w * 0.78, bh = h * 0.36;
    ctx.save();
    ctx.shadowColor = 'rgba(20,16,80,0.35)'; ctx.shadowBlur = 18; ctx.shadowOffsetY = 8;
    ctx.fillStyle = '#ffffff';
    ctx.beginPath(); ctx.roundRect((w-bw)/2, (h-bh)/2, bw, bh, bh*0.22); ctx.fill();
    if (opts.strokeOn && opts.strokeWidth > 0) {
      ctx.shadowColor = 'transparent';
      ctx.strokeStyle = opts.strokeColor;
      ctx.lineWidth = Math.max(2, opts.strokeWidth * 0.9 * scale);
      ctx.stroke();
    }
    ctx.restore();
    setFont(ctx, style, Math.min(bh * 0.44, (bw * 0.75) / Math.max(6, txt.length * 0.58)));
    ctx.fillStyle = fx.fill;
    ctx.fillText('❤  ' + txt, w/2, h/2 + 2);
    return true;
  }

  if (tr === 'brackets') {
    const fz = h * 0.44;
    setFont(ctx, style, fz);
    applyUserStrokeHelper(ctx, () => ctx.strokeText('[   ]', w/2, h*0.42), opts, scale, 0);
    ctx.fillStyle = fx.fill;
    ctx.fillText('[   ]', w/2, h*0.42);
    setFont(ctx, style, h * 0.13);
    const label = lines[lines.length - 1] || 'Invisible Text';
    applyUserStrokeHelper(ctx, () => ctx.strokeText(label, w/2, h*0.82), opts, scale, 0);
    ctx.fillStyle = '#111111';
    ctx.fillText(label, w/2, h*0.82);
    return true;
  }

  if (tr === 'warper' || tr === 'warper_box') {
    const bx = w*0.2, by = h*0.16, bw = w*0.6, bh = h*0.68;
    ctx.save();
    ctx.strokeStyle = tr === 'warper' ? 'rgba(255,255,255,0.75)' : '#38bdf8';
    ctx.lineWidth = Math.max(2, w*0.004);
    ctx.beginPath();
    ctx.moveTo(bx, by + bh*0.06);
    ctx.quadraticCurveTo(w/2, by - bh*0.08, bx+bw, by + bh*0.06);
    ctx.lineTo(bx+bw*0.96, by+bh);
    ctx.quadraticCurveTo(w/2, by+bh*0.9, bx+bw*0.04, by+bh);
    ctx.closePath(); ctx.stroke();
    [[bx,by+bh*0.06],[bx+bw,by+bh*0.06],[bx+bw*0.96,by+bh],[bx+bw*0.04,by+bh]].forEach(([px,py]) => {
      ctx.fillStyle = '#38bdf8'; ctx.fillRect(px-5, py-5, 10, 10);
    });
    ctx.restore();
    setFont(ctx, style, fontSize * 0.92);
    const totalH = lines.length * fontSize * 0.92 * lineH;
    lines.forEach((line, li) => {
      const y = h/2 - totalH/2 + (li + 0.5) * fontSize * 0.92 * lineH;
      ctx.save(); ctx.translate(w/2, y); ctx.rotate(li % 2 ? 0.05 : -0.05);
      applyUserStrokeHelper(ctx, () => drawTracked(ctx, line, 0, 0, track, 'stroke'), opts, scale, 0);
      if (fx.grad) {
        const g = ctx.createLinearGradient(0, -fontSize*0.5, 0, fontSize*0.5);
        fx.grad.forEach((c,i)=>g.addColorStop(i/(fx.grad.length-1), c));
        ctx.fillStyle = g;
      } else { ctx.fillStyle = fx.fill || '#ffffff'; }
      drawTracked(ctx, line, 0, 0, track, 'fill');
      ctx.restore();
    });
    return true;
  }

  if (tr === 'turbo') {
    const txt = lines.join(' ') || 'TURBO';
    setFont(ctx, style, fontSize);
    applyUserStrokeHelper(ctx, () => drawTracked(ctx, txt, w/2, h/2, track, 'stroke'), opts, scale, 0);
    ctx.save();
    ctx.shadowColor = fx.glow[0]; ctx.shadowBlur = fx.glow[1] * scale;

          maxY = Math.max(maxY, it.y + fontSize / 2);

      ctx.save();
      ctx.fillStyle = opts.customColor || '#111827';
      ctx.fillRect(0, 0, w, h);
      ctx.restore();
    }

    const ls = String(txt).split('\n');
    const longest = Math.max(2, Math.max.apply(null, ls.map(l => l.length)));
    const basePx = Math.min(480, (1280 * 0.78) / (longest * 0.62), (720 * 0.72) / (ls.length * 1.1));
    org.state.fontSize = Math.max(36, Math.round(basePx * ((opts.sizePct || 100) / 100)));

    if (opts.bgMode === 'custom') {
      const off = document.createElement('canvas');
      off.width = w; off.height = h;
      org.renderFrame(off.getContext('2d'), w, h, timeSec, {
        presetId: pr.id,
        text: txt,
        isThumb: false,
        forceTransparent: true
      });
      ctx.drawImage(off, 0, 0);
    } else {
      org.renderFrame(ctx, w, h, timeSec, {
        presetId: pr.id,
        text: txt,
        isThumb: isThumb,
        forceTransparent: opts.bgMode === 'transparent'
      });
    }

    if (opts.strokeOn) {
      ctx.save();
      ctx.font = '700 ' + (org.state.fontSize * (w / 1280)) + 'px ' + org.state.font;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.lineJoin = 'round';
      ctx.lineCap = 'round';
      const sw = (opts.strokeWidth || 6) * (w / 1200) * 1.2;
      const lineH = org.state.fontSize * (w / 1280) * org.state.lineHeight;
      const y0 = h / 2 - (ls.length - 1) * lineH / 2;
      ls.forEach((line, i) => {
        if (opts.strokeDouble) {
          ctx.strokeStyle = '#ffffff';
          ctx.lineWidth = sw * 1.8;
          ctx.strokeText(line, w / 2, y0 + i * lineH);
        }
        ctx.strokeStyle = opts.strokeColor || '#000000';
        ctx.lineWidth = sw;
        ctx.strokeText(line, w / 2, y0 + i * lineH);
      });
      ctx.restore();
    }
    return;
  }
  renderStyle(canvas, style, txt, opts, timeSec);
}

// ==================== UI STATE & LIVE GALLERY ====================
let activeCat = 'All';
let activeSource = 'all';
let searchQuery = '';
let globalCustomText = 'thunder';
let globalStrokeOn = false;
let globalStrokeColor = '#000000';
let globalStrokeWidth = 6;
let currentStyleIdx = 0;
let editorBgMode = 'orig';
let editorRaf = 0;
let editorStart = 0;

const gridEl = document.getElementById('grid');
const globalTextEl = document.getElementById('globalText');
const clearGlobalEl = document.getElementById('clearGlobal');
const globalStrokeOnEl = document.getElementById('globalStrokeOn');
const globalStrokeControlsEl = document.getElementById('globalStrokeControls');
const globalStrokeColorEl = document.getElementById('globalStrokeColor');
const globalStrokeWidthEl = document.getElementById('globalStrokeWidth');
const globalStrokeValEl = document.getElementById('globalStrokeVal');
const countLabelEl = document.getElementById('countLabel');
const toastEl = document.getElementById('toast');

globalTextEl.value = 'thunder';
clearGlobalEl.classList.add('show');

function showToast(msg) {
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => toastEl.classList.remove('show'), 2200);
}

// Theme toggle with localStorage
const themeBtn = document.getElementById('themeToggle');
function applyTheme(t) {
  document.documentElement.setAttribute('data-theme', t);
  themeBtn.textContent = t === 'dark' ? 'Light' : 'Dark';
  try { localStorage.setItem('typo200_theme', t); } catch {}
}
applyTheme((() => { try { return localStorage.getItem('typo200_theme') || 'light'; } catch { return 'light'; } })());
themeBtn.onclick = () => applyTheme(document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');

// Category & Studio Source pills
const categories = [
  'All', 'Anime', 'One Piece', '3D', 'Gold & Metal', 'Neon', 'Comic', 'Graffiti', 'Script',
  'Retro', 'Fire & FX', 'Cute & Fun', 'Festive',
  'Flower & Nature', 'Water & Frost', 'Kinetic & Glitch', 'Minimal'
];
const catPillsEl = document.getElementById('catPills');
categories.forEach(cat => {
  const b = document.createElement('button');
  b.className = 'pill' + (cat === 'All' ? ' active' : '');
  b.textContent = cat;
  b.onclick = () => {
    activeCat = cat;
    catPillsEl.querySelectorAll('.pill').forEach(x => x.classList.toggle('active', x === b));
    renderGrid();
  };
  catPillsEl.appendChild(b);
});

const sheetPillsEl = document.getElementById('sheetPills');
const sources = [
  { id: 'all', label: 'All (' + STYLES.length + ')' },
  { id: 'studio200', label: '200+ Studio (350)' },
  { id: 'anime', label: 'Anime & One Piece (252)' },
  { id: 'textstyle', label: 'Text Style (216)' },
  { id: 'organic', label: 'Organic Motion (169)' }
];
sources.forEach(src => {
  const b = document.createElement('button');
  b.className = 'pill' + (src.id === 'all' ? ' active' : '');
  b.style.padding = '5px 12px'; b.style.fontSize = '.7rem';
  b.textContent = src.label;
  b.onclick = () => {
    activeSource = src.id;
    sheetPillsEl.querySelectorAll('.pill').forEach(x => x.classList.toggle('active', x === b));
    renderGrid();
  };
  sheetPillsEl.appendChild(b);
});

function getGlobalRenderSig() {
  return `${globalCustomText}|${globalStrokeOn ? 1 : 0}|${globalStrokeColor}|${globalStrokeWidth}`;
}

function getGlobalRenderOpts() {
  return {
    bgMode: 'orig',
    strokeOn: globalStrokeOn,
    strokeColor: globalStrokeColor,
    strokeWidth: globalStrokeWidth,
    strokeDouble: false,
    isThumb: true
  };
}

const visibleCanvases = new Set();
const cardObserver = new IntersectionObserver((entries) => {
  const sig = getGlobalRenderSig();
  const opts = getGlobalRenderOpts();
  entries.forEach(entry => {
    const canvas = entry.target;
    if (entry.isIntersecting) {
      visibleCanvases.add(canvas);
      if (canvas.dataset.sig !== sig) {
        const style = STYLES[Number(canvas.dataset.sid) - 1];
        if (style) {
          renderUnifiedStyle(canvas, style, globalCustomText || 'thunder', opts, 1.6);
          canvas.dataset.sig = sig;
        }
      }
    } else {
      visibleCanvases.delete(canvas);
    }
  });
}, { rootMargin: '280px' });

let refreshRaf = 0;
function refreshAllPreviews() {
  cancelAnimationFrame(refreshRaf);
  refreshRaf = requestAnimationFrame(() => {
    const sig = getGlobalRenderSig();
    const opts = getGlobalRenderOpts();
    document.querySelectorAll('.live-thumb').forEach(c => { c.dataset.sig = ''; });
    visibleCanvases.forEach(canvas => {
      const style = STYLES[Number(canvas.dataset.sid) - 1];
      if (style) {
        renderUnifiedStyle(canvas, style, globalCustomText || 'thunder', opts, 1.6);
        canvas.dataset.sig = sig;
      }
    });
  });
}

globalTextEl.addEventListener('input', () => {
  globalCustomText = globalTextEl.value;
  clearGlobalEl.classList.toggle('show', globalCustomText !== 'thunder');
  refreshAllPreviews();
});
clearGlobalEl.onclick = () => {
  globalCustomText = 'thunder';
  globalTextEl.value = 'thunder';
  clearGlobalEl.classList.remove('show');
  refreshAllPreviews();
};

globalStrokeOnEl.addEventListener('change', () => {
  globalStrokeOn = globalStrokeOnEl.checked;
  globalStrokeControlsEl.classList.toggle('disabled', !globalStrokeOn);
  refreshAllPreviews();
});
globalStrokeColorEl.addEventListener('input', () => {
  globalStrokeColor = globalStrokeColorEl.value;
  if (!globalStrokeOn) {
    globalStrokeOn = true; globalStrokeOnEl.checked = true; globalStrokeControlsEl.classList.remove('disabled');
  }
  refreshAllPreviews();
});
globalStrokeWidthEl.addEventListener('input', () => {
  globalStrokeWidth = Number(globalStrokeWidthEl.value);
  globalStrokeValEl.textContent = globalStrokeWidth + 'px';
  if (!globalStrokeOn) {
    globalStrokeOn = true; globalStrokeOnEl.checked = true; globalStrokeControlsEl.classList.remove('disabled');
  }
  refreshAllPreviews();
});

document.getElementById('searchStyle').addEventListener('input', (e) => {
  searchQuery = e.target.value.trim().toLowerCase();
  renderGrid();
});

function quickDownload(style) {
  const hd = document.createElement('canvas');
  hd.width = 1800; hd.height = 990;
  const opts = getGlobalRenderOpts();
  opts.isThumb = false;
  renderUnifiedStyle(hd, style, globalCustomText || 'thunder', opts, 1.6);
  const a = document.createElement('a');
  const slug = (globalCustomText || style.name).replace(/[^a-z0-9]+/gi, '-').toLowerCase().slice(0, 32);
  a.download = `style-${style.id}-${slug}.png`;
  a.href = hd.toDataURL('image/png');
  a.click();
  showToast(`Downloaded #${style.id} ${style.name}`);
}

function renderGrid() {
  visibleCanvases.clear();
  cardObserver.disconnect();
  gridEl.innerHTML = '';

  const filtered = STYLES.filter(s => {
    if (activeCat !== 'All' && s.cat !== activeCat) return false;
    if (activeSource === 'anime' && s.sourceGroup !== 'anime') return false;
    else if (activeSource === 'studio200' && (s.engineType !== 'studio200' || s.sourceGroup === 'anime')) return false;
    else if (activeSource !== 'all' && activeSource !== 'anime' && activeSource !== 'studio200' && s.engineType !== activeSource) return false;
    if (searchQuery) {
      const q = searchQuery.replace(/^#/, '');
      const hit = String(s.id) === q || s.name.toLowerCase().includes(q) || s.cat.toLowerCase().includes(q);
      if (!hit) return false;
    }
    return true;
  });

  countLabelEl.textContent = `Showing ${filtered.length} of ${STYLES.length} live previews`;
  const frag = document.createDocumentFragment();

  filtered.forEach(style => {
    const card = document.createElement('article');
    card.className = 'card';
    card.onclick = () => openEditor(style.id - 1);

    const wrap = document.createElement('div');
    wrap.className = 'thumb-wrap';

    const cv = document.createElement('canvas');
    cv.className = 'live-thumb';
    cv.width = 480; cv.height = 268;
    cv.dataset.sid = style.id;
    cv.dataset.sig = '';
    cardObserver.observe(cv);

    const num = document.createElement('span');
    num.className = 'card-num';
    num.textContent = `#${style.id}`;

    const qdl = document.createElement('button');
    qdl.className = 'quick-dl';
    qdl.title = 'Quick Download HD PNG';
    qdl.textContent = '⬇';
    qdl.onclick = (e) => { e.stopPropagation(); quickDownload(style); };

    wrap.append(cv, num, qdl);
    if (style.engineType === 'organic' || (style.fx && style.fx.anim && style.fx.anim !== 'none')) {
      const lb = document.createElement('span');
      lb.className = 'live-badge';
      lb.textContent = '▶ LIVE';
      wrap.appendChild(lb);
      card.onmouseenter = () => { startHoverAnim(cv, style); };
      card.onmouseleave = () => { stopHoverAnim(cv, style); };
    }

    const foot = document.createElement('div');
    foot.className = 'card-foot';
    foot.innerHTML = `<span class="card-name">${style.name}</span><span class="card-cat">${style.cat}</span>`;

    card.append(wrap, foot);
    frag.appendChild(card);
  });

  gridEl.appendChild(frag);
}

// ==================== EDITOR MODAL ====================
const backdrop = document.getElementById('modalBackdrop');
const editorCanvas = document.getElementById('editorCanvas');
const mId = document.getElementById('mId');
const mTitle = document.getElementById('mTitle');
const mFontInfo = document.getElementById('mFontInfo');
const mText = document.getElementById('mText');
const mStrokeOn = document.getElementById('mStrokeOn');
const mStrokeDouble = document.getElementById('mStrokeDouble');
const mStrokeBody = document.getElementById('mStrokeBody');
const mStrokeWidth = document.getElementById('mStrokeWidth');
const mStrokeVal = document.getElementById('mStrokeVal');
const mStrokeColor = document.getElementById('mStrokeColor');
const mSize = document.getElementById('mSize');
const mTrack = document.getElementById('mTrack');
const mLine = document.getElementById('mLine');
const mSizeVal = document.getElementById('mSizeVal');
const mTrackVal = document.getElementById('mTrackVal');
const mLineVal = document.getElementById('mLineVal');
const mColorRow = document.getElementById('mColorRow');
const mCustomColor = document.getElementById('mCustomColor');
const mAnim = document.getElementById('mAnim');

function isStyleAnimated(style, animOv) {
  if (!style) return false;
  if (style.engineType === 'organic') return true;
  const m = (animOv && animOv !== 'auto') ? animOv : (style.fx && style.fx.anim ? style.fx.anim : 'none');
  return m !== 'none';
}

function getEditorOpts() {
  return {
    bgMode: editorBgMode,
    customColor: mCustomColor.value,
    sizePct: Number(mSize.value),
    tracking: Number(mTrack.value),
    lineHeight: Number(mLine.value) / 100,
    strokeOn: mStrokeOn.checked,
    strokeWidth: Number(mStrokeWidth.value),
    strokeColor: mStrokeColor.value,
    strokeDouble: mStrokeDouble.checked,
    animMode: mAnim ? mAnim.value : 'auto',
    isThumb: false
  };
}

function redrawEditor(timeSec) {
  const style = STYLES[currentStyleIdx];
  renderUnifiedStyle(editorCanvas, style, mText.value, getEditorOpts(), timeSec !== undefined ? timeSec : 1.6);
}

function startEditorLoop() {
  cancelAnimationFrame(editorRaf);
  const style = STYLES[currentStyleIdx];
  if (!isStyleAnimated(style, mAnim ? mAnim.value : 'auto')) {
    redrawEditor(1.6);
    return;
  }
  editorStart = performance.now();
  function loop(now) {
    if (!backdrop.classList.contains('open')) return;
    redrawEditor((now - editorStart) / 1000);
    editorRaf = requestAnimationFrame(loop);
  }
  editorRaf = requestAnimationFrame(loop);
}

function openEditor(idx, keepSettings = false) {
  currentStyleIdx = (idx + STYLES.length) % STYLES.length;
  const style = STYLES[currentStyleIdx];
  const srcLabel = style.sourceGroup === 'anime' ? 'Anime 3D' : (style.engineType === 'studio200' ? '200+ Studio' : (style.engineType === 'textstyle' ? 'Text Style' : 'Organic Motion'));
  mId.textContent = `#${style.id} / ${STYLES.length}`;
  mTitle.textContent = style.name;
  mFontInfo.textContent = `Font: ${style.font} • ${style.cat} • ${srcLabel}`;
  if (!keepSettings) {
    mText.value = globalCustomText.trim() ? globalCustomText : 'thunder';
    mSize.value = 100; mSizeVal.textContent = '100%';
    mTrack.value = 0; mTrackVal.textContent = '0px';
    mLine.value = 108; mLineVal.textContent = '1.08';
    mStrokeOn.checked = globalStrokeOn;
    mStrokeDouble.checked = false;
    mStrokeWidth.value = globalStrokeWidth;
    mStrokeVal.textContent = globalStrokeWidth + 'px';
    mStrokeColor.value = globalStrokeColor;
    mStrokeBody.classList.toggle('disabled', !mStrokeOn.checked);
    if (mAnim) mAnim.value = 'auto';
  }
  backdrop.classList.add('open');
  startEditorLoop();
}

function closeEditor() {
  cancelAnimationFrame(editorRaf);
  backdrop.classList.remove('open');
}

document.getElementById('mClose').onclick = closeEditor;
backdrop.onclick = (e) => { if (e.target === backdrop) closeEditor(); };
document.getElementById('mPrev').onclick = () => openEditor(currentStyleIdx - 1, true);
document.getElementById('mNext').onclick = () => openEditor(currentStyleIdx + 1, true);
document.getElementById('mResetText').onclick = () => { mText.value = 'thunder'; redrawEditor(); };

mText.addEventListener('input', () => redrawEditor());
mStrokeOn.addEventListener('change', () => {
  mStrokeBody.classList.toggle('disabled', !mStrokeOn.checked);
  redrawEditor();
});
mStrokeDouble.addEventListener('change', () => {
  if (!mStrokeOn.checked) { mStrokeOn.checked = true; mStrokeBody.classList.remove('disabled'); }
  redrawEditor();
});
mStrokeWidth.addEventListener('input', () => {
  mStrokeVal.textContent = mStrokeWidth.value + 'px';
  redrawEditor();
});
mStrokeColor.addEventListener('input', () => redrawEditor());
document.querySelectorAll('.swatch').forEach(sw => {
  sw.onclick = () => {
    mStrokeColor.value = sw.dataset.sc;
    if (!mStrokeOn.checked) { mStrokeOn.checked = true; mStrokeBody.classList.remove('disabled'); }
    redrawEditor();
  };
});

mSize.addEventListener('input', () => { mSizeVal.textContent = mSize.value + '%'; redrawEditor(); });
mTrack.addEventListener('input', () => { mTrackVal.textContent = mTrack.value + 'px'; redrawEditor(); });
mLine.addEventListener('input', () => { mLineVal.textContent = (mLine.value / 100).toFixed(2); redrawEditor(); });
mCustomColor.addEventListener('input', () => redrawEditor());
if (mAnim) mAnim.addEventListener('change', () => startEditorLoop());

document.querySelectorAll('.bg-modes button').forEach(btn => {
  btn.onclick = () => {
    editorBgMode = btn.dataset.bg;
    document.querySelectorAll('.bg-modes button').forEach(b => b.classList.toggle('active', b === btn));
    mColorRow.classList.toggle('show', editorBgMode === 'custom');
    redrawEditor();
  };
});

function exportHD(forceTransparent = false) {
  const style = STYLES[currentStyleIdx];
  const hd = document.createElement('canvas');
  hd.width = 2400; hd.height = 1320;
  const opts = getEditorOpts();
  if (forceTransparent) opts.bgMode = 'transparent';
  const t = style.engineType === 'organic' ? ((performance.now() - editorStart) / 1000 || 1.6) : 1.6;
  renderUnifiedStyle(hd, style, mText.value, opts, t);
  const a = document.createElement('a');
  const slug = (mText.value || style.name).replace(/[^a-z0-9]+/gi, '-').toLowerCase().slice(0, 32);
  a.download = `style-${style.id}-${slug}${forceTransparent ? '-transparent' : ''}.png`;
  a.href = hd.toDataURL('image/png');
  a.click();
  showToast(forceTransparent ? 'Downloaded Transparent HD PNG!' : 'Downloaded HD PNG (2400×1320)!');
}

document.getElementById('mDlFull').onclick = () => exportHD(false);
document.getElementById('mDlTrans').onclick = () => exportHD(true);
document.getElementById('mCopy').onclick = async () => {
  try {
    const hd = document.createElement('canvas');
    hd.width = 1600; hd.height = 880;
    const style = STYLES[currentStyleIdx];
    const t = style.engineType === 'organic' ? ((performance.now() - editorStart) / 1000 || 1.6) : 1.6;
    renderUnifiedStyle(hd, style, mText.value, getEditorOpts(), t);
    const blob = await new Promise(res => hd.toBlob(res, 'image/png'));
    await navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]);
    showToast('Copied HD image to clipboard!');
  } catch {
    showToast('Clipboard blocked — use Download HD PNG instead.');
  }
};

document.addEventListener('keydown', (e) => {
  if (!backdrop.classList.contains('open')) return;
  if (e.key === 'Escape') closeEditor();
});

renderGrid();
if (document.fonts && document.fonts.ready) {
  document.fonts.ready.then(() => {
    refreshAllPreviews();
    if (backdrop.classList.contains('open')) redrawEditor();
  });
}

// Hover-only live animation for animated cards (click opens full 60fps in editor)
let hoveredCardCanvas = null;
let hoveredCardStyle = null;
let hoverRaf = 0;
let hoverStart = 0;

function startHoverAnim(cv, style) {
  cancelAnimationFrame(hoverRaf);
  hoveredCardCanvas = cv;
  hoveredCardStyle = style;
  hoverStart = performance.now();
  function step(now) {
    if (hoveredCardCanvas !== cv || backdrop.classList.contains('open')) return;
    renderUnifiedStyle(cv, style, globalCustomText || 'thunder', getGlobalRenderOpts(), (now - hoverStart) / 1000);
    hoverRaf = requestAnimationFrame(step);
  }
  hoverRaf = requestAnimationFrame(step);
}

function stopHoverAnim(cv, style) {
  if (hoveredCardCanvas === cv) {
    hoveredCardCanvas = null;
    hoveredCardStyle = null;
    cancelAnimationFrame(hoverRaf);
    renderUnifiedStyle(cv, style, globalCustomText || 'thunder', getGlobalRenderOpts(), 1.6);
  }
}
</script>
